<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Boxed Test</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #letter-boxed-game {
            width: 400px;
        }
    </style>
</head>
<body>
    <div id="letter-boxed-game"></div>

    <script type="module">
        import { CleanupManager } from './js/systems/cleanup-manager.js';
        import { EventManager } from './js/systems/event-manager.js';
        import { TapeQuality } from './js/systems/tape-quality.js';
        import { VhsEffects } from './js/vhs-effects.js';

        window.cleanupManager = new CleanupManager();
        window.eventManager = new EventManager();
        window.tapeQualitySystem = new TapeQuality();
        window.vhsEffects = new VhsEffects(document.body);

        let vhsEffects;

        class LetterBoxedGame {
            constructor(containerId, puzzle) {
                this.container = document.getElementById(containerId);
                this.puzzle = puzzle;
                this.sides = puzzle.sides;
                this.pool = this.buildPool();
                this.usedWords = [];
                this.currentWord = '';
                this.currentPath = [];
                this.minWords = puzzle.minWords || 3;
                this.solved = false;

                this.render();
                this.setupEventListeners();
            }

            buildPool() {
                const pool = {};
                this.sides.forEach((side, sIdx) => {
                    side.forEach(letter => {
                        if (!pool[letter]) pool[letter] = [];
                        pool[letter].push(sIdx);
                    });
                });
                return pool;
            }

            render() {
                const allLetters = [...new Set(this.sides.flat())];
                this.container.innerHTML = `
                    <div class="letter-boxed-container">
                        <div class="letter-boxed-header">
                            <h2>LETTER BOXED</h2>
                            <p class="horror-hint">Words must start and end on <em>different</em> sides</p>
                        </div>

                        <div class="letter-boxed-pool">
                            <div class="pool-ring">
                                ${allLetters.map(l => `
                                    <button class="pool-btn" data-letter="${l}">${l}</button>
                                `).join('')}
                            </div>
                        </div>

                        <div id="current-word" class="current-word">_</div>
                        <div id="found-words" class="found-words"></div>

                        <div class="letter-boxed-controls">
                            <button id="lb-clear">CLEAR</button>
                            <button id="lb-submit" disabled>SUBMIT</button>
                            <button id="lb-shuffle">SHUFFLE</button>
                        </div>

                        <div id="lb-message" class="letter-boxed-message"></div>
                        <div class="lb-progress">
                            <span id="lb-count">0</span> / ${this.minWords}+ words found
                        </div>
                    </div>
                `;
            }

            setupEventListeners() {
                this.container.querySelectorAll('.pool-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.addLetter(btn.dataset.letter));
                });
                document.getElementById('lb-clear').addEventListener('click', () => this.clear());
                document.getElementById('lb-shuffle').addEventListener('click', () => this.shuffle());
                document.getElementById('lb-submit').addEventListener('click', () => this.submit());
            }

            addLetter(letter) {
                if (this.solved) return;
                if (this.currentWord && letter === this.currentWord.slice(-1)) return;

                this.currentWord += letter;
                this.updateDisplay();
            }

            clear() {
                this.currentWord = '';
                this.currentPath = [];
                this.updateDisplay();
            }

            shuffle() {
                const ring = this.container.querySelector('.pool-ring');
                const btns = Array.from(ring.querySelectorAll('.pool-btn'));
                btns.sort(() => Math.random() - 0.5).forEach(b => ring.appendChild(b));
            }

            submit() {
                if (!this.currentWord || this.currentWord.length < 3) return;

                if (this.usedWords.includes(this.currentWord)) {
                    this.showMessage('Already found!', 'warning');
                    this.clear();
                    return;
                }

                if (!this.isValidWord(this.currentWord)) {
                    this.showMessage('Not in puzzle word list', 'error');
                    this.clear();
                    return;
                }

                this.usedWords.push(this.currentWord);
                this.showMessage(`"${this.currentWord}" found!`, 'success');
                this.updateDisplay();
                this.clear();

                if (this.usedWords.length >= this.minWords) {
                    this.completeGame();
                }
            }

            isValidWord(word) {
                if (!this.puzzle.answers) return false;
                return this.puzzle.answers.map(w => w.toUpperCase()).includes(word);
            }

            updateDisplay() {
                document.getElementById('current-word').textContent = this.currentWord || '_';
                document.getElementById('lb-count').textContent = this.usedWords.length;
                document.getElementById('lb-submit').disabled = this.currentWord.length < 3;

                const foundEl = document.getElementById('found-words');
                foundEl.innerHTML = this.usedWords.map(w =>
                    `<span class="found-word">${w}</span>`
                ).join('');
            }

            showMessage(text, type) {
                const el = document.getElementById('lb-message');
                el.textContent = text;
                el.className = `letter-boxed-message ${type}`;
                setTimeout(() => { el.textContent = ''; }, 3000);
            }

            completeGame() {
                this.solved = true;
                this.showMessage('All words found!', 'success');
            }
        }

        window.LetterBoxedGame = LetterBoxedGame;

        const samplePuzzle = {
            sides: [["C","R","I"],["L","U","E"],["S","A","T"],["D","O","N"]],
            answers: ["CRUEL","SLATE","DRAIN","CAULDRON"],
            minWords: 3
        };

        document.addEventListener('DOMContentLoaded', () => {
            new LetterBoxedGame('letter-boxed-game', samplePuzzle);
        });
    </script>
</body>
</html>
