<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections Test</title>
    <style>
        .connections-container {
            max-width: 600px;
            margin: 50px auto;
            font-family: Arial, sans-serif;
        }
        .connections-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .connections-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .connections-tile {
            width: 100px;
            height: 100px;
            border: 2px solid #ccc;
            border-radius: 4px;
            text-align: center;
            line-height: 100px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            background-color: #f8f9fa;
        }
        .connections-tile.selected {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .connections-tile.correct {
            background-color: #28a745;
            color: white;
            border-color: #28a745;
        }
        .connections-controls {
            text-align: center;
            margin-bottom: 20px;
        }
        .connections-controls button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }
        .connections-controls button:hover {
            background-color: #0056b3;
        }
        .connections-message {
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .connections-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .connections-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div id="connections-game"></div>

    <script src="js/games/connections.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new ConnectionsGame('connections-game');
        });
    </script>
</body>
</html>
